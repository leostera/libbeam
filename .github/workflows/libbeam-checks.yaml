name: libbeam Bazel checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release, ubsan]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.3'
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev perl binutils
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0; .bazelversion selects 9.3.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.configuration }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Native tests and read-only freshness check
        shell: bash
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -euo pipefail
          exec 9>"/tmp/otp-realm-validation-$(id -u).lock"
          flock 9
          bazel --version
          test "$(bazel --version)" = 'bazel 9.3.0'
          git rev-parse HEAD
          options=()
          if [[ "$CONFIGURATION" != debug ]]; then options+=("--config=$CONFIGURATION"); fi
          bazel test "${options[@]}" //... --jobs=6 --test_summary=detailed \
            --build_event_json_file="$RUNNER_TEMP/libbeam-tests.json"
          bazel test "${options[@]}" --check_tests_up_to_date //... --jobs=6
      - name: Collect native evidence
        if: always()
        shell: bash
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$CONFIGURATION" != debug ]]; then options+=("--config=$CONFIGURATION"); fi
          logs=$(bazel info "${options[@]}" bazel-testlogs)
          if [[ -d "$logs" ]]; then cp -RL "$logs" "$RUNNER_TEMP/libbeam-testlogs"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libbeam-${{ matrix.configuration }}-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/libbeam-tests.json
            ${{ runner.temp }}/libbeam-testlogs/**/*.log
            ${{ runner.temp }}/libbeam-testlogs/**/*.xml
      # Repository-layout checks, not runtime compatibility acceptance.
      - name: Check ordinary tracked snapshot layout
        run: |
          test -f beam/otp_build
          test ! -e beam/.git
          test -z "$(git ls-files --stage beam | awk '$1 == "160000" {print}')"
          test ! -e beam/lib/kernel/src/realm.erl
          test ! -e beam/scripts/realm-validation.py
