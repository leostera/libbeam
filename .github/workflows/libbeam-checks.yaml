name: libbeam source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s libbeam/tools -p 'test_*.py' -v
      - name: Install additive compression dependency
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Check additive C components (not Engine acceptance)
        shell: bash
        run: |
          set -euo pipefail
          exec 9>"/tmp/otp-realm-validation-$(id -u).lock"
          flock 9
          for config in Debug Release; do
            build=$(mktemp -d "${RUNNER_TEMP}/libbeam-core.XXXXXX")
            git rev-parse HEAD > "$build/source-revision.txt"
            sha256sum libbeam/core/*.[ch] libbeam/tests/core_*_test.c \
              libbeam/core/otp/atom.names libbeam/core/otp/bif.tab \
              libbeam/tools/generate_atoms.py libbeam/tools/otp/make_tables \
              libbeam/tools/check_term_representation.py libbeam/tools/generate_opcodes.py \
              libbeam/tools/otp/beam_makeops libbeam/core/otp/loader-sources.json \
              libbeam/core/otp/execution-sources.json libbeam/tools/project_transform.py \
              libbeam/tools/project_dispatch.py \
              > "$build/source-hashes.txt"
            find libbeam/core/otp/opcodes -type f -print0 | sort -z | \
              xargs -0 sha256sum >> "$build/source-hashes.txt"
            python3 -B libbeam/tools/check_term_representation.py --output "$build/term-oracle"
            cmake -S libbeam -B "$build" -DBUILD_TESTING=ON \
              -DCMAKE_BUILD_TYPE="$config" -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
            cmake --build "$build"
            ctest --test-dir "$build" --output-on-failure
          done
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.3'
      - name: Execute the selected additive profile (not Engine/Isolate acceptance)
        shell: bash
        run: |
          set -euo pipefail
          parent=$(mktemp -d "${RUNNER_TEMP}/libbeam-execution.XXXXXX")
          python3 -B libbeam/tools/run_additive_slice.py --output "$parent/run"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libbeam-execution-evidence
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/libbeam-execution.*/run/**/*.log
            ${{ runner.temp }}/libbeam-execution.*/run/**/*.json
      - name: Check ordinary tracked snapshot layout
        run: |
          test -f beam/otp_build
          test ! -e beam/.git
          test -z "$(git ls-files --stage beam | awk '$1 == "160000" {print}')"
          test ! -e beam/lib/kernel/src/realm.erl
          test ! -e beam/scripts/realm-validation.py
