name: libbeam source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s libbeam/tools -p 'test_*.py' -v
      - name: Check additive C components (not Engine acceptance)
        shell: bash
        run: |
          set -euo pipefail
          exec 9>"/tmp/otp-realm-validation-$(id -u).lock"
          flock 9
          for config in Debug Release; do
            build=$(mktemp -d "${RUNNER_TEMP}/libbeam-core.XXXXXX")
            git rev-parse HEAD > "$build/source-revision.txt"
            sha256sum libbeam/core/*.[ch] libbeam/tests/core_*_test.c \
              libbeam/core/otp/atom.names libbeam/core/otp/bif.tab \
              libbeam/tools/generate_atoms.py libbeam/tools/otp/make_tables \
              libbeam/tools/check_term_representation.py > "$build/source-hashes.txt"
            python3 -B libbeam/tools/check_term_representation.py --output "$build/term-oracle"
            cmake -S libbeam -B "$build" -DBUILD_TESTING=ON \
              -DCMAKE_BUILD_TYPE="$config" -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
            cmake --build "$build"
            ctest --test-dir "$build" --output-on-failure
          done
      - name: Check ordinary tracked snapshot layout
        run: |
          test -f beam/otp_build
          test ! -e beam/.git
          test -z "$(git ls-files --stage beam | awk '$1 == "160000" {print}')"
          test ! -e beam/lib/kernel/src/realm.erl
          test ! -e beam/scripts/realm-validation.py
