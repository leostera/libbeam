name: Experimental Realm runtime matrix
# Deliberately manual while expensive native tests and platform gaps are reviewed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        variant: [opt-jit, debug-jit, opt-emu, debug-emu]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf build-essential libncurses-dev libssl-dev
      - name: Bootstrap and regenerate preloads
        shell: bash
        run: |
          set -euo pipefail
          export ERL_TOP="$PWD" PATH="$PWD/bin:$PATH"
          unset ERL_FLAGS ERL_AFLAGS ERL_ZFLAGS ERL_LIBS
          ./otp_build configure --without-wx --without-odbc --without-javac
          make -j4
          ./otp_build update_preloaded --no-commit
          make -j4
      - name: Tooling and inventory checks
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_realm_*.py' -v
          python3 scripts/realm-inventory.py --check
          python3 scripts/realm-inventory.py --surface nif-api --check
          python3 scripts/realm-native-surfaces.py --check
          python3 scripts/realm-review.py --check
      - name: Realm and focused legacy regression matrix cell
        run: >-
          python3 scripts/realm-validation.py --variants ${{ matrix.variant }}
          --output /tmp/realm-ci-core --jobs 4
      - name: Public API contracts
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/realm-validation.py --variants ${{ matrix.variant }}
          --profile public-api --output /tmp/realm-ci-api --jobs 4
      - name: Publish summaries only (raw CT logs may contain cookies)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: realms-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            /tmp/realm-ci-core/summary.json
            /tmp/realm-ci-api/summary.json
          if-no-files-found: warn
  summarize:
    needs: runtime
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: realms-*
          path: /tmp/realm-ci-artifacts
      - name: Require every matrix cell and exact test counts
        if: ${{ always() }}
        run: >-
          python3 scripts/realm-ci-report.py --artifacts /tmp/realm-ci-artifacts
          --revision "$GITHUB_SHA" --output /tmp/realm-ci-matrix.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: realm-runtime-matrix-report
          path: /tmp/realm-ci-matrix.json
          if-no-files-found: error
