name: Realm inventory drift and tooling
on:
  pull_request:
    paths:
      - 'erts/emulator/**'
      - 'scripts/realm-*.py'
      - 'scripts/realm-*.sh'
      - 'scripts/realm_*.erl'
      - 'scripts/test_realm_*.py'
      - 'rfd/0001-*.tsv'
      - 'lib/**/c_src/**'
      - 'lib/**/src/**'
      - 'erts/preloaded/src/**'
      - '.github/workflows/realms-runtime.yaml'
      - '.github/workflows/realms-inventory.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Test validation and inventory tooling
        run: python3 -B -m unittest discover -s scripts -p 'test_realm_*.py' -v
      - name: Detect native surface and review dependency drift
        run: |
          python3 scripts/realm-inventory.py --check
          python3 scripts/realm-inventory.py --surface nif-api --check
          python3 scripts/realm-native-surfaces.py --check
          python3 scripts/realm-review.py --check
